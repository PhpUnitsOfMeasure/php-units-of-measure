# Creates a git tag and a GitHub release from the CHANGELOG.md section of the given version.
# Run manually: Actions -> Release -> Run workflow, e.g. version "v2.2.3".
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v2.2.3 (must have a "## vX.Y.Z" section in CHANGELOG.md)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like v1.2.3, got '$VERSION'"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ inputs.version }}
        run: |
          awk -v ver="$VERSION" '
            index($0, "## " ver " ") == 1 || $0 == "## " ver { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::No '## $VERSION' section found in CHANGELOG.md"
            exit 1
          fi
          cat notes.md

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"
          gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file notes.md
